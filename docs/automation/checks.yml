name: RepForge checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm run lint && npm test
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: repforge_ci
      JWT_SECRET: ci-fixture-only-not-a-production-signing-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: pip install -r backend/requirements-lock.txt
      - run: python -m pytest -q tests/test_hardening_*.py tests/test_google_auth.py tests/test_standalone.py
        working-directory: backend
